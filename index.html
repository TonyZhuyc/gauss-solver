<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高斯消元求解器</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; }
  textarea { width: 100%; height: 150px; font-family: monospace; }
  button { padding: 0.5em 1em; font-size: 1em; margin-top: 0.5em; }
  #output { white-space: pre-wrap; background: #f4f4f4; padding: 1em; margin-top: 1em; }
</style>
</head>
<body>
<h2>高斯消元求解线性方程组</h2>
<label>n = <input id="n" type="number" value="3" min="1" max="100"></label>
<br><br>
<textarea id="matrix" placeholder="每行输入 n+1 个数（增广矩阵 A|b）"></textarea>
<br>
<button id="go">求解</button>
<pre id="output">等待计算…</pre>

<script src="gauss.js"></script>
<script>
const MAXN = 100;
const STRIDE = MAXN + 1;

Module.onRuntimeInitialized = () => {
  const solve = Module.cwrap('solve_linear_system', 'number', ['number', 'number', 'number']);

  document.getElementById('go').onclick = () => {
    const out = document.getElementById('output');
    const n = parseInt(document.getElementById('n').value, 10);
    if (!(n >= 1 && n <= MAXN)) { out.textContent = 'n 必须在 1~100 之间'; return; }

    const lines = document.getElementById('matrix').value.trim().split(/\n+/);
    if (lines.length < n) { out.textContent = '行数不足'; return; }

    const aug = new Float64Array(MAXN * STRIDE);
    for (let i = 0; i < n; i++) {
      const parts = lines[i].trim().split(/\s+/).map(Number);
      if (parts.length < n + 1 || parts.some(isNaN)) {
        out.textContent = `第 ${i+1} 行数据格式不对`;
        return;
      }
      for (let j = 0; j <= n; j++) aug[i * STRIDE + j] = parts[j];
    }

    const bpe = 8;
    const augPtr = Module._malloc(aug.length * bpe);
    const xPtr = Module._malloc(n * bpe);
    Module.HEAPF64.set(aug, augPtr / bpe);
    Module.HEAPF64.fill(0, xPtr / bpe, xPtr / bpe + n);

    const ok = solve(augPtr, n, xPtr);

    if (!ok) {
      out.textContent = '对角主元精确等于 0，无法继续（可能是奇异矩阵）';
    } else {
      const x = Module.HEAPF64.subarray(xPtr / bpe, xPtr / bpe + n);
      let s = '解为：\n';
      for (let i = 0; i < n; i++) s += `x${i+1} = ${x[i]}\n`;
      out.textContent = s;
    }

    Module._free(augPtr);
    Module._free(xPtr);
  };
};
</script>
</body>
</html>
