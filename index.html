<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高斯消元求解器</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; }
  textarea { width: 100%; height: 150px; font-family: monospace; font-size: 14px; }
  button { padding: 0.5em 1em; font-size: 1em; margin-top: 0.5em; cursor: pointer; }
  #output { white-space: pre-wrap; background: #f4f4f4; padding: 1em; margin-top: 1em; min-height: 2em; }
  input { font-size: 16px; padding: 2px 5px; width: 60px; }
</style>
</head>
<body>
<h2>高斯消元求解线性方程组</h2>
<label>n = <input id="n" type="number" value="3" min="1" max="100"></label>
<br><br>
<textarea id="matrix" placeholder="每行输入 n+1 个数（增广矩阵 A|b），数与数之间用空格隔开"></textarea>
<br>
<button id="go">求解</button>
<pre id="output">等待计算…</pre>

<script src="gauss.js"></script>
<script>
Module.onRuntimeInitialized = () => {
  const solve = Module.cwrap('solve_linear_system_string', 'string', ['string']);

  document.getElementById('go').onclick = () => {
    const out = document.getElementById('output');
    const n = document.getElementById('n').value;
    const matrix = document.getElementById('matrix').value;
    
    if (!matrix.trim()) {
      out.textContent = '请输入矩阵数据';
      return;
    }

    const input = n + "\n" + matrix;
    
    try {
      const result = solve(input);
      out.textContent = result;
    } catch (e) {
      out.textContent = "调用出错：" + e.message;
    }
  };
};
</script>
</body>
</html>
